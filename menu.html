<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Food Fudge — Menu</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --ink:#2B1B14;
    --cream:#FFF8EF;
    --terracotta:#C75D3B;
    --sage:#7A8C5C;
    --tan:#E8D5B5;
    --tan-soft:#F3E6CC;
    --max-w:1180px;
  }

  *{
    box-sizing:border-box;
    margin:0;
    padding:0;
  }

  html{
    scroll-behavior:smooth;
  }

  body{
    background:var(--cream);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  img{
    max-width:100%;
    display:block;
  }

  a{
    color:inherit;
    text-decoration:none;
  }

  h1,h2,h3{
    font-family:'Fraunces', serif;
    font-weight:600;
    line-height:1.1;
  }

  .wrap{
    max-width:var(--max-w);
    margin:0 auto;
    padding:0 32px;
  }

  a:focus-visible,
  button:focus-visible{
    outline:3px solid var(--terracotta);
    outline-offset:3px;
  }

  @media (prefers-reduced-motion: reduce){
    *{
      animation:none !important;
      transition:none !important;
    }
  }

  /* ---------- Header ---------- */

  header{
    position:sticky;
    top:0;
    z-index:100;
    background:rgba(255,248,239,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid var(--tan);
  }

  .nav{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:18px 32px;
    max-width:var(--max-w);
    margin:0 auto;
  }

  .logo{
    font-family:'Fraunces', serif;
    font-size:1.5rem;
    font-weight:600;
    letter-spacing:-0.01em;
  }

  .logo span{
    color:var(--terracotta);
  }

  .nav-links{
    display:flex;
    gap:36px;
    list-style:none;
    font-size:0.95rem;
    font-weight:500;
  }

  .nav-links a{
    position:relative;
    padding:4px 0;
    transition:color 0.2s ease;
  }

  .nav-links a:hover{
    color:var(--terracotta);
  }

  .nav-links a.active{
    color:var(--terracotta);
  }

  .nav-cta{
    background:var(--ink);
    color:var(--cream);
    padding:11px 22px;
    border-radius:99px;
    font-size:0.9rem;
    font-weight:600;
    transition:background 0.2s ease, transform 0.2s ease;
  }

  .nav-cta:hover{
    background:var(--terracotta);
    transform:translateY(-1px);
  }

  .nav-toggle{
    display:none;
    background:none;
    border:none;
    cursor:pointer;
    padding:8px;
  }

  .nav-toggle span{
    display:block;
    width:24px;
    height:2px;
    background:var(--ink);
    margin:5px 0;
    transition:0.25s;
  }


  /* ---------- Menu Hero ---------- */

  .menu-hero{
    padding:80px 0 60px;
    text-align:center;
  }

  .menu-hero .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    background:var(--tan-soft);
    color:var(--ink);
    padding:7px 14px;
    border-radius:99px;
    font-size:0.82rem;
    font-weight:600;
    letter-spacing:0.02em;
    margin-bottom:20px;
  }

  .menu-hero .eyebrow::before{
    content:"";
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--sage);
  }

  .menu-hero h1{
    font-size:clamp(2.5rem,5vw,4rem);
    margin-bottom:18px;
    letter-spacing:-0.01em;
  }

  .menu-hero p{
    color:#5a473c;
    font-size:1.08rem;
    max-width:60ch;
    margin:0 auto;
  }


  /* ---------- Category Navigation ---------- */

  .category-nav{
    padding:0 0 55px;
  }

  .category-links{
    display:flex;
    justify-content:center;
    gap:12px;
    flex-wrap:wrap;
    list-style:none;
  }

  .category-links a{
    display:inline-block;
    padding:10px 20px;
    border:1.5px solid var(--ink);
